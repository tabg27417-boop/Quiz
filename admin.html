<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Quiz App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav style="background:#4a90d9;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-size:1.3em;font-weight:bold;color:#fff;">📝 Admin Panel</span>
    <div id="navRight" style="display:flex;align-items:center;gap:12px;"></div>
  </nav>

  <div id="loading" class="box center"><h2>Loading...</h2></div>

  <div id="adminArea" style="display:none">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('quizzesTab',this)">Quizzes</button>
      <button class="tab" onclick="switchTab('addTab',this)">Add Quiz</button>
      <button class="tab" onclick="switchTab('accessTab',this)">Access</button>
      <button class="tab" onclick="switchTab('resultsTab',this)">Results</button>
    </div>

    <!-- QUIZZES TAB -->
    <div id="quizzesTab" class="tabContent box">
      <h2>All Quizzes</h2>
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;">
        <label>Batch:</label>
        <select id="filterBatch" onchange="renderQuizList()">
          <option value="all">All</option>
          <option value="SSC">SSC</option>
          <option value="HSC">HSC</option>
        </select>
        <label>Subject:</label>
        <select id="filterSubject" onchange="renderQuizList()">
          <option value="all">All</option>
        </select>
      </div>
      <div id="adminQuizList"></div>
    </div>

    <!-- ADD QUIZ TAB -->
    <div id="addTab" class="tabContent box" style="display:none">
      <h2>Create Quiz</h2>

      <!-- STEP 1: Setup -->
      <div id="quizSetup">
        <div class="form-group">
          <label>Select Batch</label>
          <div class="batch-select">
            <label class="batch-option">
              <input type="radio" name="qBatch" value="SSC" checked>
              <span class="batch-card">🏫 SSC</span>
            </label>
            <label class="batch-option">
              <input type="radio" name="qBatch" value="HSC">
              <span class="batch-card">🎓 HSC</span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>Subject Name</label>
          <input id="qSubject" placeholder="e.g. Physics, Math, English">
        </div>
        <div class="form-group">
          <label>Quiz Title</label>
          <input id="qTitle" placeholder="e.g. Chapter 1 Test">
        </div>
        <div class="form-group">
          <label>Number of Questions</label>
          <input id="qCount" type="number" min="1" max="100" placeholder="e.g. 10">
        </div>
        <button class="btn blue" onclick="startAddingQuestions()">Next → Add Questions</button>
      </div>

      <!-- STEP 2: Add questions one by one -->
      <div id="quizQuestions" style="display:none">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
          <div>
            <span class="badge blue" id="setupBatchBadge"></span>
            <span class="badge gray" id="setupSubjectBadge"></span>
            <strong id="setupTitleBadge" style="margin-left:8px;"></strong>
          </div>
          <button class="btn sm gray" onclick="backToSetup()">← Back to Setup</button>
        </div>

        <!-- Progress -->
        <div style="background:#eee;border-radius:8px;height:12px;margin-bottom:16px;overflow:hidden;">
          <div id="qProgressBar" style="background:#4a90d9;height:100%;border-radius:8px;transition:width 0.3s;width:0%"></div>
        </div>
        <p id="qProgressText" style="text-align:center;font-weight:600;margin-bottom:16px;"></p>

        <!-- Current question -->
        <div id="currentQuestionForm" class="q-block">
          <h3 id="currentQLabel">Question 1</h3>
          <div class="form-group">
            <label>Question Text</label>
            <textarea id="cqText" placeholder="Enter question text" rows="3"></textarea>
          </div>
          <div class="grid2">
            <div class="form-group"><label>Option A</label><input id="cqA" placeholder="Option A"></div>
            <div class="form-group"><label>Option B</label><input id="cqB" placeholder="Option B"></div>
            <div class="form-group"><label>Option C</label><input id="cqC" placeholder="Option C"></div>
            <div class="form-group"><label>Option D</label><input id="cqD" placeholder="Option D"></div>
          </div>
          <div class="form-group">
            <label>Correct Answer</label>
            <select id="cqCorrect">
              <option value="a">A</option>
              <option value="b">B</option>
              <option value="c">C</option>
              <option value="d">D</option>
            </select>
          </div>
          <div class="form-group">
            <label>Explanation (optional)</label>
            <textarea id="cqExp" placeholder="Explanation shown after submit" rows="2"></textarea>
          </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
          <button class="btn gray" id="prevQBtn" onclick="prevQuestion()" style="display:none">← Previous</button>
          <button class="btn blue" id="nextQBtn" onclick="nextQuestion()">Next Question →</button>
          <button class="btn green" id="saveQuizBtn" onclick="handleSaveQuiz()" style="display:none">💾 Save Quiz</button>
        </div>

        <!-- Question overview -->
        <div id="savedQuestionsPreview" style="margin-top:24px;"></div>
      </div>
    </div>

    <!-- ACCESS TAB -->
    <div id="accessTab" class="tabContent box" style="display:none">
      <h2>Manage Access</h2>
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;">
        <label>Filter by Batch:</label>
        <select id="accessBatchFilter" onchange="renderAccessTab()">
          <option value="all">All</option>
          <option value="SSC">SSC</option>
          <option value="HSC">HSC</option>
        </select>
      </div>
      <div id="studentAccessList"></div>
      <hr style="margin:20px 0;border:none;border-top:1px solid #eee;">
      <h3>Grant Single Quiz Access</h3>
      <div class="flex" style="margin-top:10px;">
        <div><label>Student</label><select id="selStudent"></select></div>
        <div><label>Quiz</label><select id="selQuiz"></select></div>
        <div style="padding-top:24px">
          <button class="btn green" onclick="grantAccess()">Grant</button>
          <button class="btn red" onclick="revokeAccess()">Revoke</button>
        </div>
      </div>
    </div>

    <!-- RESULTS TAB -->
    <div id="resultsTab" class="tabContent box" style="display:none">
      <h2>All Results</h2>
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;">
        <label>Batch:</label>
        <select id="resultBatchFilter" onchange="loadResults()">
          <option value="all">All</option>
          <option value="SSC">SSC</option>
          <option value="HSC">HSC</option>
        </select>
      </div>
      <div id="allResults"></div>
    </div>
  </div>

  <div id="msg"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>
    var allStudents = [];
    var allQuizzes = [];
    var allAccess = [];

    // Quiz creation state
    var quizSetupData = { batch: '', subject: '', title: '', totalQ: 0 };
    var quizQuestions = [];
    var currentQIndex = 0;

    firebase.auth().onAuthStateChanged(function(u) {
      if (!u) { window.location = 'index.html'; return; }
      db.collection('users').doc(u.uid).get()
        .then(function(doc) {
          if (!doc.exists || !doc.data().isAdmin) { window.location = 'index.html'; return; }
          document.getElementById('loading').style.display = 'none';
          setNav(doc.data().name, 'Admin');
          document.getElementById('adminArea').style.display = 'block';
          loadAll();
        })
        .catch(function(e) {
          flash('Error: ' + e.message, false);
        });
    });

    function switchTab(id, btn) {
      var tabs = document.querySelectorAll('.tabContent');
      for (var i = 0; i < tabs.length; i++) tabs[i].style.display = 'none';
      var buttons = document.querySelectorAll('.tab');
      for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('active');
      document.getElementById(id).style.display = 'block';
      btn.classList.add('active');
      if (id === 'resultsTab') loadResults();
    }

    // ============ STEP 1: SETUP ============
    function startAddingQuestions() {
      var batch = document.querySelector('input[name="qBatch"]:checked').value;
      var subject = document.getElementById('qSubject').value.trim();
      var title = document.getElementById('qTitle').value.trim();
      var count = parseInt(document.getElementById('qCount').value);

      if (!subject) { flash('Enter subject name', false); return; }
      if (!title) { flash('Enter quiz title', false); return; }
      if (!count || count < 1) { flash('Enter valid number of questions', false); return; }
      if (count > 100) { flash('Maximum 100 questions', false); return; }

      quizSetupData = { batch: batch, subject: subject, title: title, totalQ: count };
      quizQuestions = [];
      currentQIndex = 0;

      for (var i = 0; i < count; i++) {
        quizQuestions.push({ text: '', a: '', b: '', c: '', d: '', correct: 'a', explanation: '' });
      }

      document.getElementById('setupBatchBadge').textContent = batch;
      document.getElementById('setupBatchBadge').className = 'badge ' + (batch === 'HSC' ? 'purple' : 'blue');
      document.getElementById('setupSubjectBadge').textContent = subject;
      document.getElementById('setupTitleBadge').textContent = title;

      document.getElementById('quizSetup').style.display = 'none';
      document.getElementById('quizQuestions').style.display = 'block';
      loadQuestionForm();
    }

    function backToSetup() {
      if (!confirm('Go back? Your entered questions will be preserved.')) return;
      document.getElementById('quizSetup').style.display = 'block';
      document.getElementById('quizQuestions').style.display = 'none';
    }

    // ============ STEP 2: ONE BY ONE ============
    function loadQuestionForm() {
      var q = quizQuestions[currentQIndex];
      var total = quizSetupData.totalQ;

      document.getElementById('currentQLabel').textContent = 'Question ' + (currentQIndex + 1) + ' of ' + total;
      document.getElementById('cqText').value = q.text;
      document.getElementById('cqA').value = q.a;
      document.getElementById('cqB').value = q.b;
      document.getElementById('cqC').value = q.c;
      document.getElementById('cqD').value = q.d;
      document.getElementById('cqCorrect').value = q.correct;
      document.getElementById('cqExp').value = q.explanation;

      // Progress
      var filled = 0;
      for (var i = 0; i < quizQuestions.length; i++) {
        if (quizQuestions[i].text.trim() !== '') filled++;
      }
      var pct = Math.round((filled / total) * 100);
      document.getElementById('qProgressBar').style.width = pct + '%';
      document.getElementById('qProgressText').textContent = filled + ' / ' + total + ' questions filled (' + pct + '%)';

      // Buttons
      document.getElementById('prevQBtn').style.display = currentQIndex > 0 ? 'inline-block' : 'none';
      document.getElementById('nextQBtn').style.display = currentQIndex < total - 1 ? 'inline-block' : 'none';
      document.getElementById('saveQuizBtn').style.display = currentQIndex === total - 1 ? 'inline-block' : 'none';

      renderSavedPreview();
    }

    function saveCurrentQuestion() {
      quizQuestions[currentQIndex] = {
        text: document.getElementById('cqText').value.trim(),
        a: document.getElementById('cqA').value.trim(),
        b: document.getElementById('cqB').value.trim(),
        c: document.getElementById('cqC').value.trim(),
        d: document.getElementById('cqD').value.trim(),
        correct: document.getElementById('cqCorrect').value,
        explanation: document.getElementById('cqExp').value.trim()
      };
    }

    function validateCurrentQuestion() {
      var q = quizQuestions[currentQIndex];
      if (!q.text) { flash('Enter question text', false); return false; }
      if (!q.a || !q.b || !q.c || !q.d) { flash('Fill all 4 options', false); return false; }
      return true;
    }

    function nextQuestion() {
      saveCurrentQuestion();
      if (!validateCurrentQuestion()) return;
      currentQIndex++;
      loadQuestionForm();
      window.scrollTo({ top: document.getElementById('currentQuestionForm').offsetTop - 100, behavior: 'smooth' });
    }

    function prevQuestion() {
      saveCurrentQuestion();
      currentQIndex--;
      loadQuestionForm();
    }

    function jumpToQuestion(i) {
      saveCurrentQuestion();
      currentQIndex = i;
      loadQuestionForm();
      window.scrollTo({ top: document.getElementById('currentQuestionForm').offsetTop - 100, behavior: 'smooth' });
    }

    function renderSavedPreview() {
      var html = '<h3 style="margin-top:10px;">📋 Question Overview</h3>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">';
      for (var i = 0; i < quizQuestions.length; i++) {
        var q = quizQuestions[i];
        var filled = q.text.trim() !== '';
        var isCurrent = i === currentQIndex;
        var bg = isCurrent ? '#4a90d9' : filled ? '#43a047' : '#ccc';
        var color = isCurrent || filled ? '#fff' : '#666';
        html += '<button onclick="jumpToQuestion(' + i + ')" style="width:40px;height:40px;border-radius:8px;border:none;cursor:pointer;font-weight:bold;background:' + bg + ';color:' + color + ';">' + (i + 1) + '</button>';
      }
      html += '</div>';

      // Summary
      var hasAny = false;
      for (var i = 0; i < quizQuestions.length; i++) {
        if (quizQuestions[i].text.trim()) { hasAny = true; break; }
      }
      if (hasAny) {
        html += '<div style="margin-top:16px;">';
        for (var i = 0; i < quizQuestions.length; i++) {
          var q = quizQuestions[i];
          if (!q.text.trim()) continue;
          html += '<div style="background:#f8f9fa;border:1px solid #eee;border-radius:8px;padding:12px;margin:8px 0;cursor:pointer;" onclick="jumpToQuestion(' + i + ')">';
          html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
          html += '<span><strong>Q' + (i + 1) + ':</strong> ' + q.text.substring(0, 80) + (q.text.length > 80 ? '...' : '') + '</span>';
          html += '<span class="badge green" style="margin-left:8px;">✓ ' + q.correct.toUpperCase() + '</span>';
          html += '</div></div>';
        }
        html += '</div>';
      }

      document.getElementById('savedQuestionsPreview').innerHTML = html;
    }

    // ============ SAVE QUIZ ============
    function handleSaveQuiz() {
      saveCurrentQuestion();
      if (!validateCurrentQuestion()) return;

      // Validate ALL
      for (var i = 0; i < quizQuestions.length; i++) {
        var q = quizQuestions[i];
        if (!q.text || !q.a || !q.b || !q.c || !q.d) {
          flash('Question ' + (i + 1) + ' is incomplete. Click on it to fill.', false);
          return;
        }
      }

      var btn = document.getElementById('saveQuizBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      var questions = [];
      for (var i = 0; i < quizQuestions.length; i++) {
        var q = quizQuestions[i];
        questions.push({
          id: 'q' + (i + 1),
          text: q.text,
          a: q.a,
          b: q.b,
          c: q.c,
          d: q.d,
          correct: q.correct,
          explanation: q.explanation
        });
      }

      db.collection('quizzes').add({
        title: quizSetupData.title,
        subject: quizSetupData.subject,
        batch: quizSetupData.batch,
        questions: questions,
        created: firebase.firestore.FieldValue.serverTimestamp()
      })
      .then(function() {
        flash('Quiz "' + quizSetupData.title + '" created with ' + questions.length + ' questions!');
        document.getElementById('qTitle').value = '';
        document.getElementById('qSubject').value = '';
        document.getElementById('qCount').value = '';
        quizQuestions = [];
        currentQIndex = 0;
        document.getElementById('quizSetup').style.display = 'block';
        document.getElementById('quizQuestions').style.display = 'none';
        loadAll();
      })
      .catch(function(e) {
        flash('Error saving: ' + e.message, false);
      })
      .finally(function() {
        btn.disabled = false;
        btn.textContent = '💾 Save Quiz';
      });
    }

    // ============ LOAD ALL ============
    function loadAll() {
      Promise.all([
        db.collection('quizzes').get(),
        db.collection('users').where('isAdmin', '==', false).get(),
        db.collection('access').get()
      ]).then(function(results) {
        allQuizzes = [];
        results[0].forEach(function(d) { allQuizzes.push({ id: d.id, data: d.data() }); });

        allStudents = [];
        results[1].forEach(function(d) { allStudents.push({ id: d.id, data: d.data() }); });

        allAccess = [];
        results[2].forEach(function(d) { allAccess.push({ id: d.id, data: d.data() }); });

        updateSubjectFilter();
        renderQuizList();
        renderAccessTab();
      }).catch(function(e) {
        flash('Error loading data: ' + e.message, false);
      });
    }

    function updateSubjectFilter() {
      var subjects = [];
      for (var i = 0; i < allQuizzes.length; i++) {
        var s = allQuizzes[i].data.subject || 'Unknown';
        if (subjects.indexOf(s) === -1) subjects.push(s);
      }
      var html = '<option value="all">All</option>';
      for (var i = 0; i < subjects.length; i++) {
        html += '<option value="' + subjects[i] + '">' + subjects[i] + '</option>';
      }
      document.getElementById('filterSubject').innerHTML = html;
    }

    // ============ QUIZ LIST ============
    function renderQuizList() {
      var batchF = document.getElementById('filterBatch').value;
      var subjectF = document.getElementById('filterSubject').value;

      var filtered = [];
      for (var i = 0; i < allQuizzes.length; i++) {
        var q = allQuizzes[i];
        var batchOk = batchF === 'all' || (q.data.batch || '') === batchF;
        var subjectOk = subjectF === 'all' || (q.data.subject || '') === subjectF;
        if (batchOk && subjectOk) filtered.push(q);
      }

      if (filtered.length === 0) {
        document.getElementById('adminQuizList').innerHTML = '<p class="muted">No quizzes found</p>';
        return;
      }

      var html = '<table><tr><th>Batch</th><th>Subject</th><th>Title</th><th>Questions</th><th>Action</th></tr>';
      for (var i = 0; i < filtered.length; i++) {
        var q = filtered[i];
        var bc = (q.data.batch === 'HSC') ? 'purple' : 'blue';
        html += '<tr>' +
          '<td><span class="badge ' + bc + '">' + (q.data.batch || '—') + '</span></td>' +
          '<td><span class="badge gray">' + (q.data.subject || '—') + '</span></td>' +
          '<td>' + q.data.title + '</td>' +
          '<td>' + q.data.questions.length + '</td>' +
          '<td><button class="btn sm blue" onclick="viewQuiz(\'' + q.id + '\')">View</button> ' +
          '<button class="btn sm red" onclick="delQuiz(\'' + q.id + '\')">Delete</button></td></tr>';
      }
      html += '</table>';
      document.getElementById('adminQuizList').innerHTML = html;
    }

    function viewQuiz(id) {
      var quiz = null;
      for (var i = 0; i < allQuizzes.length; i++) {
        if (allQuizzes[i].id === id) { quiz = allQuizzes[i]; break; }
      }
      if (!quiz) return;
      var q = quiz.data;

      var html = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;overflow:auto;padding:20px;" onclick="if(event.target===this)this.remove()">';
      html += '<div style="max-width:700px;margin:40px auto;background:#fff;border-radius:12px;padding:24px;">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
      html += '<h2>' + q.title + '</h2>';
      html += '<button class="btn sm gray" onclick="this.closest(\'div[style*=fixed]\').remove()">✕ Close</button>';
      html += '</div>';
      html += '<p><span class="badge ' + (q.batch === 'HSC' ? 'purple' : 'blue') + '">' + (q.batch || '—') + '</span> ';
      html += '<span class="badge gray">' + (q.subject || '—') + '</span> ';
      html += '<span class="muted">' + q.questions.length + ' questions</span></p><hr>';

      for (var i = 0; i < q.questions.length; i++) {
        var qs = q.questions[i];
        html += '<div style="margin:16px 0;padding:12px;background:#f8f9fa;border-radius:8px;">';
        html += '<strong>Q' + (i + 1) + ':</strong> ' + qs.text + '<br>';
        html += '<div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;">';
        var opts = ['a', 'b', 'c', 'd'];
        for (var j = 0; j < opts.length; j++) {
          var opt = opts[j];
          var isC = qs.correct === opt;
          html += '<div style="padding:6px 10px;border-radius:6px;background:' + (isC ? '#e8f5e9' : '#fff') + ';border:1px solid ' + (isC ? '#43a047' : '#ddd') + ';">';
          html += '<strong>' + opt.toUpperCase() + ':</strong> ' + qs[opt];
          if (isC) html += ' ✅';
          html += '</div>';
        }
        html += '</div>';
        if (qs.explanation) html += '<div style="margin-top:8px;color:#666;font-size:13px;">💡 ' + qs.explanation + '</div>';
        html += '</div>';
      }
      html += '</div></div>';
      document.body.insertAdjacentHTML('beforeend', html);
    }

    function delQuiz(id) {
      if (!confirm('Delete this quiz and all related data?')) return;

      var p1 = db.collection('quizzes').doc(id).delete();
      var p2 = db.collection('access').where('quizId', '==', id).get().then(function(snap) {
        var dels = [];
        snap.docs.forEach(function(d) { dels.push(d.ref.delete()); });
        return Promise.all(dels);
      });
      var p3 = db.collection('attempts').where('quizId', '==', id).get().then(function(snap) {
        var dels = [];
        snap.docs.forEach(function(d) { dels.push(d.ref.delete()); });
        return Promise.all(dels);
      });

      Promise.all([p1, p2, p3]).then(function() {
        flash('Deleted');
        loadAll();
      }).catch(function(e) {
        flash('Error: ' + e.message, false);
      });
    }

    // ============ ACCESS TAB ============
    function renderAccessTab() {
      var batchFilter = document.getElementById('accessBatchFilter').value;

      var students = [];
      for (var i = 0; i < allStudents.length; i++) {
        var s = allStudents[i];
        if (batchFilter === 'all' || (s.data.batch || 'SSC') === batchFilter) {
          students.push(s);
        }
      }

      var html = '';
      if (students.length === 0) {
        html = '<p class="muted">No students found</p>';
      } else {
        for (var i = 0; i < students.length; i++) {
          var s = students[i];
          var sBatch = s.data.batch || 'SSC';
          var studentAccess = [];
          for (var j = 0; j < allAccess.length; j++) {
            if (allAccess[j].data.userId === s.id) studentAccess.push(allAccess[j]);
          }
          var accessQuizIds = [];
          for (var j = 0; j < studentAccess.length; j++) {
            accessQuizIds.push(studentAccess[j].data.quizId);
          }

          var batchQuizzes = [];
          for (var j = 0; j < allQuizzes.length; j++) {
            if ((allQuizzes[j].data.batch || '') === sBatch) batchQuizzes.push(allQuizzes[j]);
          }

          var hasAll = batchQuizzes.length > 0;
          for (var j = 0; j < batchQuizzes.length; j++) {
            if (accessQuizIds.indexOf(batchQuizzes[j].id) === -1) { hasAll = false; break; }
          }
          var hasNone = studentAccess.length === 0;
          var batchClass = sBatch === 'HSC' ? 'purple' : 'blue';

          html += '<div style="border:1px solid #eee;border-radius:8px;padding:16px;margin:10px 0;background:#fafafa;">';
          html += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">';
          html += '<div><strong style="font-size:16px;">👤 ' + s.data.name + '</strong>';
          html += ' <span class="badge ' + batchClass + '" style="font-size:11px;">' + sBatch + '</span>';
          html += '<div style="color:#666;font-size:13px;">' + s.data.email + '</div></div>';
          html += '<div style="display:flex;gap:8px;align-items:center;">';

          if (hasAll) {
            html += '<span class="badge green" style="padding:6px 12px;">All Access ✅</span>';
          } else if (hasNone) {
            html += '<span class="badge red" style="padding:6px 12px;">No Access</span>';
          } else {
            html += '<span class="badge blue" style="padding:6px 12px;">' + accessQuizIds.length + '/' + batchQuizzes.length + '</span>';
          }

          html += '<button class="btn sm green" onclick="grantAll(\'' + s.id + '\',\'' + sBatch + '\')">Grant All</button>';
          html += '<button class="btn sm red" onclick="revokeAll(\'' + s.id + '\')">Revoke All</button>';
          html += '</div></div>';

          if (accessQuizIds.length > 0 && !hasAll) {
            html += '<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;">';
            for (var j = 0; j < batchQuizzes.length; j++) {
              var q = batchQuizzes[j];
              var has = accessQuizIds.indexOf(q.id) !== -1;
              if (has) {
                html += '<span class="badge green" style="padding:4px 10px;">' + (q.data.subject ? q.data.subject + ' - ' : '') + q.data.title + ' ✓</span>';
              } else {
                html += '<span class="badge gray" style="padding:4px 10px;background:#ccc;color:#666;">' + (q.data.subject ? q.data.subject + ' - ' : '') + q.data.title + '</span>';
              }
            }
            html += '</div>';
          }
          html += '</div>';
        }
      }
      document.getElementById('studentAccessList').innerHTML = html;

      // Dropdowns
      var sOpts = '';
      for (var i = 0; i < allStudents.length; i++) {
        var s = allStudents[i];
        sOpts += '<option value="' + s.id + '">' + s.data.name + ' (' + (s.data.batch || 'SSC') + ') - ' + s.data.email + '</option>';
      }
      document.getElementById('selStudent').innerHTML = sOpts || '<option>No students</option>';

      var qOpts = '';
      for (var i = 0; i < allQuizzes.length; i++) {
        var q = allQuizzes[i];
        qOpts += '<option value="' + q.id + '">[' + (q.data.batch || '?') + '] ' + (q.data.subject ? q.data.subject + ' - ' : '') + q.data.title + '</option>';
      }
      document.getElementById('selQuiz').innerHTML = qOpts || '<option>No quizzes</option>';
    }

    // ============ GRANT / REVOKE ============
    function grantAll(userId, batch) {
      if (!confirm('Grant access to ALL ' + batch + ' quizzes?')) return;
      var batchQuizzes = [];
      for (var i = 0; i < allQuizzes.length; i++) {
        if ((allQuizzes[i].data.batch || '') === batch) batchQuizzes.push(allQuizzes[i]);
      }
      var existing = [];
      for (var i = 0; i < allAccess.length; i++) {
        if (allAccess[i].data.userId === userId) existing.push(allAccess[i].data.quizId);
      }

      var promises = [];
      var count = 0;
      for (var i = 0; i < batchQuizzes.length; i++) {
        if (existing.indexOf(batchQuizzes[i].id) === -1) {
          promises.push(db.collection('access').add({ userId: userId, quizId: batchQuizzes[i].id }));
          count++;
        }
      }

      Promise.all(promises).then(function() {
        flash('Granted ' + count + ' new quiz access!');
        loadAll();
      });
    }

    function revokeAll(userId) {
      if (!confirm('Revoke ALL access?')) return;
      var toRemove = [];
      for (var i = 0; i < allAccess.length; i++) {
        if (allAccess[i].data.userId === userId) toRemove.push(allAccess[i]);
      }
      var promises = [];
      for (var i = 0; i < toRemove.length; i++) {
        promises.push(db.collection('access').doc(toRemove[i].id).delete());
      }
      Promise.all(promises).then(function() {
        flash('Revoked ' + toRemove.length + ' access entries');
        loadAll();
      });
    }

    function grantAccess() {
      var userId = document.getElementById('selStudent').value;
      var quizId = document.getElementById('selQuiz').value;
      if (!userId || !quizId) { flash('Select student and quiz', false); return; }

      db.collection('access').where('userId', '==', userId).where('quizId', '==', quizId).get()
        .then(function(snap) {
          if (!snap.empty) { flash('Already granted', false); return; }
          return db.collection('access').add({ userId: userId, quizId: quizId });
        })
        .then(function() {
          flash('Access granted!');
          loadAll();
        });
    }

    function revokeAccess() {
      var userId = document.getElementById('selStudent').value;
      var quizId = document.getElementById('selQuiz').value;
      db.collection('access').where('userId', '==', userId).where('quizId', '==', quizId).get()
        .then(function(snap) {
          if (snap.empty) { flash('No access found', false); return; }
          var promises = [];
          snap.docs.forEach(function(d) { promises.push(d.ref.delete()); });
          return Promise.all(promises);
        })
        .then(function() {
          flash('Access revoked');
          loadAll();
        });
    }

    // ============ RESULTS ============
    function loadResults() {
      document.getElementById('allResults').innerHTML = '<div class="loader"></div>';
      var batchFilter = document.getElementById('resultBatchFilter').value;

      db.collection('attempts').get().then(function(snap) {
        if (snap.empty) {
          document.getElementById('allResults').innerHTML = '<p class="muted">No results yet</p>';
          return;
        }

        var promises = [];
        snap.docs.forEach(function(d) {
          var a = d.data();
          promises.push(
            Promise.all([
              db.collection('users').doc(a.userId).get(),
              db.collection('quizzes').doc(a.quizId).get()
            ]).then(function(results) {
              return { attemptId: d.id, attempt: a, userDoc: results[0], quizDoc: results[1] };
            })
          );
        });

        return Promise.all(promises).then(function(rows) {
          var filtered = [];
          for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            if (!r.userDoc.exists || !r.quizDoc.exists) continue;
            var uData = r.userDoc.data();
            var studentBatch = uData.batch || 'SSC';
            if (batchFilter !== 'all' && studentBatch !== batchFilter) continue;

            var pct = Math.round(r.attempt.score / r.attempt.total * 100);
            filtered.push({
              name: uData.name,
              batch: studentBatch,
              batchClass: studentBatch === 'HSC' ? 'purple' : 'blue',
              subject: r.quizDoc.data().subject || '—',
              quiz: r.quizDoc.data().title,
              score: r.attempt.score,
              total: r.attempt.total,
              pct: pct,
              color: pct >= 70 ? 'green' : pct >= 40 ? 'blue' : 'red',
              date: r.attempt.date ? new Date(r.attempt.date).toLocaleDateString() : '',
              id: r.attemptId
            });
          }

          if (filtered.length === 0) {
            document.getElementById('allResults').innerHTML = '<p class="muted">No results found</p>';
            return;
          }

          var html = '<table><tr><th>Student</th><th>Batch</th><th>Subject</th><th>Quiz</th><th>Score</th><th>Date</th><th></th></tr>';
          for (var i = 0; i < filtered.length; i++) {
            var r = filtered[i];
            html += '<tr>' +
              '<td>' + r.name + '</td>' +
              '<td><span class="badge ' + r.batchClass + '">' + r.batch + '</span></td>' +
              '<td><span class="badge gray">' + r.subject + '</span></td>' +
              '<td>' + r.quiz + '</td>' +
              '<td><span class="badge ' + r.color + '">' + r.score + '/' + r.total + ' (' + r.pct + '%)</span></td>' +
              '<td>' + r.date + '</td>' +
              '<td><a class="btn sm gray" href="result.html?id=' + r.id + '">View</a></td></tr>';
          }
          html += '</table>';
          document.getElementById('allResults').innerHTML = html;
        });
      }).catch(function(e) {
        document.getElementById('allResults').innerHTML = '<p class="muted">Error loading results</p>';
      });
    }
  </script>
