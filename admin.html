<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Quiz App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav style="background:#4a90d9;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;">
    <span style="font-size:1.3em;font-weight:bold;color:#fff;">📝 Admin Panel</span>
    <div id="navRight" style="display:flex;align-items:center;gap:12px;"></div>
  </nav>

  <div id="loading" class="box center"><h2>Loading...</h2></div>

  <div id="adminArea" style="display:none">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('quizzesTab',this)">Quizzes</button>
      <button class="tab" onclick="switchTab('addTab',this)">Add Quiz</button>
      <button class="tab" onclick="switchTab('accessTab',this)">Access</button>
      <button class="tab" onclick="switchTab('resultsTab',this)">Results</button>
    </div>

    <!-- QUIZZES TAB -->
    <div id="quizzesTab" class="tabContent box">
      <h2>All Quizzes</h2>
      <div id="adminQuizList"></div>
    </div>

    <!-- ADD QUIZ TAB -->
    <div id="addTab" class="tabContent box" style="display:none">
      <h2>Create Quiz</h2>
      <label>Title</label>
      <input id="qTitle" placeholder="Quiz title">
      <div id="questionsArea"></div>
      <div style="margin:12px 0">
        <button class="btn gray" onclick="addQuestionField()">+ Add Question</button>
        <button class="btn green" id="saveQuizBtn" onclick="handleSaveQuiz()">Save Quiz</button>
      </div>
    </div>

    <!-- ACCESS TAB -->
    <div id="accessTab" class="tabContent box" style="display:none">
      <h2>Manage Access</h2>

      <!-- Student list with Grant All / Revoke All -->
      <div id="studentAccessList"></div>

      <hr style="margin:20px 0;border:none;border-top:1px solid #eee;">

      <!-- Single quiz access -->
      <h3>Grant Single Quiz Access</h3>
      <div class="flex" style="margin-top:10px;">
        <div><label>Student</label><select id="selStudent"></select></div>
        <div><label>Quiz</label><select id="selQuiz"></select></div>
        <div style="padding-top:24px">
          <button class="btn green" onclick="grantAccess()">Grant</button>
          <button class="btn red" onclick="revokeAccess()">Revoke</button>
        </div>
      </div>
    </div>

    <!-- RESULTS TAB -->
    <div id="resultsTab" class="tabContent box" style="display:none">
      <h2>All Results</h2>
      <div id="allResults"></div>
    </div>
  </div>

  <div id="msg"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>
    var qCount = 0;
    var allStudents = [];
    var allQuizzes = [];
    var allAccess = [];

    firebase.auth().onAuthStateChanged(async function(u) {
      if (!u) { window.location = 'index.html'; return; }
      try {
        var doc = await db.collection('users').doc(u.uid).get();
        if (!doc.exists || !doc.data().isAdmin) { window.location = 'index.html'; return; }
        $('loading').style.display = 'none';
        setNav(doc.data().name);
        $('adminArea').style.display = 'block';
        addQuestionField();
        loadAll();
      } catch (e) {
        flash('Error: ' + e.message, false);
      }
    });

    function switchTab(id, btn) {
      document.querySelectorAll('.tabContent').forEach(function(d) { d.style.display = 'none'; });
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      $(id).style.display = 'block';
      btn.classList.add('active');
      if (id === 'resultsTab') loadResults();
    }

    // ============ ADD QUIZ ============

    function addQuestionField() {
      qCount++;
      var div = document.createElement('div');
      div.className = 'q-block';
      div.innerHTML =
        '<h3>Question ' + qCount + ' <button class="btn sm red" onclick="this.parentElement.parentElement.remove()">✕</button></h3>' +
        '<textarea placeholder="Question text" class="qq"></textarea>' +
        '<div class="grid2">' +
        '<input placeholder="Option A" class="qa">' +
        '<input placeholder="Option B" class="qb">' +
        '<input placeholder="Option C" class="qc">' +
        '<input placeholder="Option D" class="qd">' +
        '</div>' +
        '<label>Correct Answer</label>' +
        '<select class="qcorrect"><option value="a">A</option><option value="b">B</option><option value="c">C</option><option value="d">D</option></select>' +
        '<label>Explanation</label>' +
        '<textarea placeholder="Explanation shown after submit" class="qexp"></textarea>';
      $('questionsArea').appendChild(div);
    }

    async function handleSaveQuiz() {
      var btn = $('saveQuizBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      await saveQuiz();
      btn.disabled = false;
      btn.textContent = 'Save Quiz';
    }

    async function saveQuiz() {
      var title = $('qTitle').value.trim();
      if (!title) return flash('Enter title', false);
      var blocks = document.querySelectorAll('#questionsArea .q-block');
      if (blocks.length === 0) return flash('Add at least one question', false);
      var questions = [];
      var valid = true;
      blocks.forEach(function(b, i) {
        var text = b.querySelector('.qq').value.trim();
        var a = b.querySelector('.qa').value.trim();
        var bv = b.querySelector('.qb').value.trim();
        var c = b.querySelector('.qc').value.trim();
        var d = b.querySelector('.qd').value.trim();
        if (!text || !a || !bv || !c || !d) { valid = false; return; }
        questions.push({
          id: 'q' + (i + 1), text: text, a: a, b: bv, c: c, d: d,
          correct: b.querySelector('.qcorrect').value,
          explanation: b.querySelector('.qexp').value.trim()
        });
      });
      if (!valid) return flash('Fill all question fields', false);
      await db.collection('quizzes').add({ title: title, questions: questions, created: firebase.firestore.FieldValue.serverTimestamp() });
      flash('Quiz created!');
      $('qTitle').value = '';
      $('questionsArea').innerHTML = '';
      qCount = 0;
      addQuestionField();
      loadAll();
    }

    // ============ LOAD ALL DATA ============

    async function loadAll() {
      // Get all quizzes
      var qSnap = await db.collection('quizzes').get();
      allQuizzes = [];
      qSnap.forEach(function(d) { allQuizzes.push({ id: d.id, data: d.data() }); });

      // Get all students
      var uSnap = await db.collection('users').where('isAdmin', '==', false).get();
      allStudents = [];
      uSnap.forEach(function(d) { allStudents.push({ id: d.id, data: d.data() }); });

      // Get all access
      var aSnap = await db.collection('access').get();
      allAccess = [];
      aSnap.forEach(function(d) { allAccess.push({ id: d.id, data: d.data() }); });

      renderQuizList();
      renderAccessTab();
    }

    // ============ QUIZ LIST ============

    function renderQuizList() {
      if (allQuizzes.length === 0) {
        $('adminQuizList').innerHTML = '<p class="muted">No quizzes yet</p>';
        return;
      }
      var html = '<table><tr><th>Title</th><th>Questions</th><th>Action</th></tr>';
      for (var i = 0; i < allQuizzes.length; i++) {
        var q = allQuizzes[i];
        html += '<tr><td>' + q.data.title + '</td><td>' + q.data.questions.length + '</td>' +
          '<td><button class="btn sm red" onclick="delQuiz(\'' + q.id + '\')">Delete</button></td></tr>';
      }
      html += '</table>';
      $('adminQuizList').innerHTML = html;
    }

    async function delQuiz(id) {
      if (!confirm('Delete this quiz?')) return;
      await db.collection('quizzes').doc(id).delete();
      var aDocs = await db.collection('access').where('quizId', '==', id).get();
      for (var i = 0; i < aDocs.docs.length; i++) await aDocs.docs[i].ref.delete();
      var atDocs = await db.collection('attempts').where('quizId', '==', id).get();
      for (var i = 0; i < atDocs.docs.length; i++) await atDocs.docs[i].ref.delete();
      flash('Deleted');
      loadAll();
    }

    // ============ ACCESS TAB ============

    function renderAccessTab() {
      // Student cards with Grant All / Revoke All
      var html = '';
      if (allStudents.length === 0) {
        html = '<p class="muted">No students registered yet</p>';
      } else {
        for (var i = 0; i < allStudents.length; i++) {
          var s = allStudents[i];
          // Find which quizzes this student has access to
          var studentAccess = allAccess.filter(function(a) { return a.data.userId === s.id; });
          var accessQuizIds = studentAccess.map(function(a) { return a.data.quizId; });

          var hasAll = allQuizzes.length > 0 && allQuizzes.every(function(q) { return accessQuizIds.indexOf(q.id) !== -1; });
          var hasNone = accessQuizIds.length === 0;

          html += '<div style="border:1px solid #eee;border-radius:8px;padding:16px;margin:10px 0;background:#fafafa;">';
          html += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">';
          html += '<div>';
          html += '<strong style="font-size:16px;">👤 ' + s.data.name + '</strong>';
          html += '<div style="color:#666;font-size:13px;">' + s.data.email + '</div>';
          html += '</div>';
          html += '<div style="display:flex;gap:8px;align-items:center;">';

          if (hasAll) {
            html += '<span class="badge green" style="padding:6px 12px;">All Access ✅</span>';
          } else if (hasNone) {
            html += '<span class="badge red" style="padding:6px 12px;">No Access</span>';
          } else {
            html += '<span class="badge blue" style="padding:6px 12px;">' + accessQuizIds.length + '/' + allQuizzes.length + ' Quizzes</span>';
          }

          html += '<button class="btn sm green" onclick="grantAll(\'' + s.id + '\')">Grant All</button>';
          html += '<button class="btn sm red" onclick="revokeAll(\'' + s.id + '\')">Revoke All</button>';
          html += '</div></div>';

          // Show individual quiz access
          if (accessQuizIds.length > 0 && !hasAll) {
            html += '<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;">';
            for (var j = 0; j < allQuizzes.length; j++) {
              var q = allQuizzes[j];
              var hasAccess = accessQuizIds.indexOf(q.id) !== -1;
              if (hasAccess) {
                html += '<span class="badge green" style="padding:4px 10px;">' + q.data.title + ' ✓</span>';
              } else {
                html += '<span class="badge gray" style="padding:4px 10px;background:#ccc;color:#666;">' + q.data.title + '</span>';
              }
            }
            html += '</div>';
          }

          html += '</div>';
        }
      }
      $('studentAccessList').innerHTML = html;

      // Single quiz dropdowns
      var sOpts = '';
      for (var i = 0; i < allStudents.length; i++) {
        var s = allStudents[i];
        sOpts += '<option value="' + s.id + '">' + s.data.name + ' (' + s.data.email + ')</option>';
      }
      $('selStudent').innerHTML = sOpts || '<option>No students</option>';

      var qOpts = '';
      for (var i = 0; i < allQuizzes.length; i++) {
        qOpts += '<option value="' + allQuizzes[i].id + '">' + allQuizzes[i].data.title + '</option>';
      }
      $('selQuiz').innerHTML = qOpts || '<option>No quizzes</option>';
    }

    // ============ GRANT / REVOKE ALL ============

    async function grantAll(userId) {
      if (!confirm('Grant access to ALL quizzes for this student?')) return;
      var existing = allAccess.filter(function(a) { return a.data.userId === userId; });
      var existingQuizIds = existing.map(function(a) { return a.data.quizId; });

      var count = 0;
      for (var i = 0; i < allQuizzes.length; i++) {
        if (existingQuizIds.indexOf(allQuizzes[i].id) === -1) {
          await db.collection('access').add({ userId: userId, quizId: allQuizzes[i].id });
          count++;
        }
      }
      flash('Granted access to ' + count + ' new quizzes!');
      loadAll();
    }

    async function revokeAll(userId) {
      if (!confirm('Revoke ALL quiz access for this student?')) return;
      var toRemove = allAccess.filter(function(a) { return a.data.userId === userId; });
      for (var i = 0; i < toRemove.length; i++) {
        await db.collection('access').doc(toRemove[i].id).delete();
      }
      flash('Revoked all access (' + toRemove.length + ' quizzes)');
      loadAll();
    }

    // ============ SINGLE GRANT / REVOKE ============

    async function grantAccess() {
      var userId = $('selStudent').value;
      var quizId = $('selQuiz').value;
      if (!userId || !quizId) return flash('Select student and quiz', false);
      var exists = await db.collection('access').where('userId', '==', userId).where('quizId', '==', quizId).get();
      if (!exists.empty) return flash('Already granted', false);
      await db.collection('access').add({ userId: userId, quizId: quizId });
      flash('Access granted!');
      loadAll();
    }

    async function revokeAccess() {
      var userId = $('selStudent').value;
      var quizId = $('selQuiz').value;
      var snap = await db.collection('access').where('userId', '==', userId).where('quizId', '==', quizId).get();
      if (snap.empty) return flash('No access found', false);
      for (var i = 0; i < snap.docs.length; i++) await snap.docs[i].ref.delete();
      flash('Access revoked');
      loadAll();
    }

    // ============ RESULTS ============

    async function loadResults() {
      var snap = await db.collection('attempts').get();
      if (snap.empty) { $('allResults').innerHTML = '<p class="muted">No results yet</p>'; return; }
      var html = '<table><tr><th>Student</th><th>Quiz</th><th>Score</th><th>Date</th><th></th></tr>';
      for (var i = 0; i < snap.docs.length; i++) {
        var d = snap.docs[i];
        var a = d.data();
        var uDoc = await db.collection('users').doc(a.userId).get();
        var qDoc = await db.collection('quizzes').doc(a.quizId).get();
        var pct = Math.round(a.score / a.total * 100);
        var color = pct >= 70 ? 'green' : pct >= 40 ? 'blue' : 'red';
        html += '<tr>' +
          '<td>' + (uDoc.exists ? uDoc.data().name : '?') + '</td>' +
          '<td>' + (qDoc.exists ? qDoc.data().title : '?') + '</td>' +
          '<td><span class="badge ' + color + '">' + a.score + '/' + a.total + ' (' + pct + '%)</span></td>' +
          '<td>' + (a.date ? new Date(a.date).toLocaleDateString() : '') + '</td>' +
          '<td><a class="btn sm gray" href="result.html?id=' + d.id + '">View</a></td>' +
          '</tr>';
      }
      html += '</table>';
      $('allResults').innerHTML = html;
    }
  </script>
</body>
</html>
