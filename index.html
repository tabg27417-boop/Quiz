<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <nav>
    <span class="brand"><i class="fa-solid fa-pen-to-square"></i> QuizApp</span>
    <div id="navRight"></div>
  </nav>

  <div class="container">
    <!-- AUTH BOX -->
    <div class="box auth-box" id="authBox">
      <!-- LOGIN -->
      <div id="loginForm">
        <h2 style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-lock" style="color:var(--primary);"></i> Login</h2>
        <p class="muted" style="margin-bottom:16px;">Welcome back! Sign in to continue.</p>
        <div class="form-group">
          <label><i class="fa-solid fa-envelope"></i> Email</label>
          <input id="lEmail" type="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label><i class="fa-solid fa-key"></i> Password</label>
          <input id="lPass" type="password" placeholder="••••••••">
        </div>
        <button class="btn blue full" onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
        <p class="center muted" style="margin-top:14px;">No account? <a href="javascript:void(0)" onclick="showReg()">Register here</a></p>
      </div>

      <!-- REGISTER -->
      <div id="regForm" style="display:none">
        <h2 style="display:flex;align-items:center;gap:8px;"><i class="fa-solid fa-user-plus" style="color:var(--primary);"></i> Register</h2>
        <p class="muted" style="margin-bottom:16px;">Create your account to get started.</p>
        <div class="form-group">
          <label><i class="fa-solid fa-user"></i> Full Name</label>
          <input id="rName" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label><i class="fa-solid fa-envelope"></i> Email</label>
          <input id="rEmail" type="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label><i class="fa-solid fa-key"></i> Password</label>
          <input id="rPass" type="password" placeholder="Min 6 characters">
        </div>
        <div class="form-group">
          <label><i class="fa-solid fa-layer-group"></i> Select Batch</label>
          <div class="batch-select">
            <label class="batch-option">
              <input type="radio" name="batch" value="SSC" checked>
              <span class="batch-card"><i class="fa-solid fa-school"></i> SSC</span>
            </label>
            <label class="batch-option">
              <input type="radio" name="batch" value="HSC">
              <span class="batch-card"><i class="fa-solid fa-graduation-cap"></i> HSC</span>
            </label>
          </div>
        </div>
        <button class="btn blue full" onclick="register()"><i class="fa-solid fa-user-plus"></i> Register</button>
        <p class="center muted" style="margin-top:14px;">Have account? <a href="javascript:void(0)" onclick="showLogin()">Login here</a></p>
      </div>
    </div>

    <!-- STUDENT DASHBOARD -->
    <div id="dashboard" style="display:none">
      <div class="dash-header">
        <h1 id="welcome"></h1>
        <span class="badge big" id="batchBadge"></span>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-icon"><i class="fa-solid fa-list-check"></i></div>
          <div class="stat-num" id="statTotal">0</div>
          <div class="stat-label">Total Quizzes</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fa-solid fa-circle-check" style="color:var(--success);"></i></div>
          <div class="stat-num" id="statDone">0</div>
          <div class="stat-label">Completed</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fa-solid fa-hourglass-half" style="color:var(--warning);"></i></div>
          <div class="stat-num" id="statPending">0</div>
          <div class="stat-label">Pending</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fa-solid fa-chart-line" style="color:var(--secondary);"></i></div>
          <div class="stat-num" id="statAvg">—</div>
          <div class="stat-label">Avg Score</div>
        </div>
      </div>

      <!-- NEWSFEED -->
      <div id="newsfeedContainer" class="newsfeed-section">
        <div class="newsfeed-header">
          <h2 style="color:#fff;margin:0;font-size:15px;display:flex;align-items:center;gap:8px;">
            <i class="fa-solid fa-spinner fa-spin"></i> Loading common mistakes...
          </h2>
        </div>
        <div style="padding:16px 24px;color:var(--text3);font-size:13px;">Fetching data...</div>
      </div>

      <div class="box">
        <h2 style="display:flex;align-items:center;gap:8px;justify-content:space-between;">
          <span><i class="fa-solid fa-clipboard-list" style="color:var(--primary);"></i> Your Quizzes</span>
        </h2>
        <div id="quizList"><div class="loader"></div></div>
      </div>
    </div>
  </div>

  <div id="msg"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>
    firebase.auth().onAuthStateChanged(function(u) {
      if (u) {
        db.collection('users').doc(u.uid).get()
          .then(function(doc) {
            if (!doc.exists) {
              flash('User data not found. Please wait...', false);
              setTimeout(function() {
                db.collection('users').doc(u.uid).get().then(function(doc2) {
                  if (doc2.exists) handleUserData(u.uid, doc2.data());
                  else flash('Profile not found. Try logging out and back in.', false);
                });
              }, 2000);
              return;
            }
            handleUserData(u.uid, doc.data());
          })
          .catch(function(e) { flash('Error loading profile', false); });
      } else {
        document.getElementById('authBox').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        clearNav();
        // Still load newsfeed for guests (public)
        // Newsfeed is only in dashboard, so nothing needed here
      }
    });

    function handleUserData(uid, data) {
      if (data.isAdmin) { window.location = 'admin.html'; return; }
      document.getElementById('authBox').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('welcome').innerHTML = '<i class="fa-solid fa-hand-wave" style="color:var(--warning);"></i> Welcome, ' + data.name + '!';
      var batch = data.batch || 'SSC';
      var isHSC = batch === 'HSC';
      document.getElementById('batchBadge').innerHTML = '<i class="fa-solid ' + (isHSC ? 'fa-graduation-cap' : 'fa-school') + '"></i> ' + batch;
      document.getElementById('batchBadge').className = 'badge big ' + (isHSC ? 'purple' : 'blue');
      setNav(data.name, batch);
      loadNewsfeed('newsfeedContainer');
      loadStudentQuizzes(uid, batch);
    }

    function loadStudentQuizzes(uid, batch) {
      db.collection('access').where('userId', '==', uid).get()
        .then(function(accessSnap) {
          var accessQuizIds = [];
          accessSnap.docs.forEach(function(d) { accessQuizIds.push(d.data().quizId); });
          return db.collection('attempts').where('userId', '==', uid).get()
            .then(function(attemptSnap) {
              var attempted = {};
              attemptSnap.docs.forEach(function(d) {
                var ad = d.data();
                attempted[ad.quizId] = { id: d.id, score: ad.score, total: ad.total };
              });
              return { accessQuizIds: accessQuizIds, attempted: attempted };
            });
        })
        .then(function(result) {
          var accessQuizIds = result.accessQuizIds;
          var attempted = result.attempted;
          if (accessQuizIds.length === 0) {
            document.getElementById('quizList').innerHTML = '<p class="muted center"><i class="fa-solid fa-inbox" style="font-size:24px;display:block;margin-bottom:8px;"></i>No quizzes assigned yet.</p>';
            updateStats(0, 0, 0, []); return;
          }
          var promises = accessQuizIds.map(function(qid) { return db.collection('quizzes').doc(qid).get(); });
          return Promise.all(promises).then(function(quizDocs) {
            var html = '<table><tr>' +
              '<th><i class="fa-solid fa-book"></i> Subject</th>' +
              '<th><i class="fa-solid fa-file-alt"></i> Quiz</th>' +
              '<th><i class="fa-solid fa-question-circle"></i> Qs</th>' +
              '<th><i class="fa-solid fa-flag"></i> Status</th>' +
              '<th></th></tr>';
            var total = 0, done = 0, scores = [];
            for (var i = 0; i < quizDocs.length; i++) {
              var qDoc = quizDocs[i];
              if (!qDoc.exists) continue;
              var q = qDoc.data(); var qid = qDoc.id;
              if (q.batch && q.batch !== batch) continue;
              total++;
              var att = attempted[qid];
              if (att) { done++; scores.push(Math.round((att.score / att.total) * 100)); }
              html += '<tr>' +
                '<td><span class="badge gray"><i class="fa-solid fa-tag"></i> ' + (q.subject || '—') + '</span></td>' +
                '<td style="font-weight:500;">' + q.title + '</td>' +
                '<td><span style="background:var(--primary-light);color:var(--primary);padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600;">' + q.questions.length + '</span></td>' +
                '<td>' + (att
                  ? '<span class="badge green"><i class="fa-solid fa-check"></i> Done (' + att.score + '/' + att.total + ')</span>'
                  : '<span class="badge orange"><i class="fa-solid fa-clock"></i> Pending</span>') + '</td>' +
                '<td>' + (att
                  ? '<a class="btn sm gray" href="result.html?id=' + att.id + '"><i class="fa-solid fa-chart-bar"></i> Result</a>'
                  : '<a class="btn sm blue" href="quiz.html?id=' + qid + '"><i class="fa-solid fa-play"></i> Start</a>') + '</td></tr>';
            }
            if (total === 0) {
              document.getElementById('quizList').innerHTML = '<p class="muted center">No quizzes for your batch yet.</p>';
              updateStats(0, 0, 0, []); return;
            }
            html += '</table>';
            document.getElementById('quizList').innerHTML = html;
            updateStats(total, done, total - done, scores);
          });
        })
        .catch(function(e) {
          document.getElementById('quizList').innerHTML = '<p class="muted center"><i class="fa-solid fa-triangle-exclamation"></i> Error loading quizzes.</p>';
        });
    }

    function updateStats(total, done, pending, scores) {
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statDone').textContent = done;
      document.getElementById('statPending').textContent = pending;
      var avg = '—';
      if (scores.length > 0) {
        var sum = 0;
        for (var i = 0; i < scores.length; i++) sum += scores[i];
        avg = Math.round(sum / scores.length) + '%';
      }
      document.getElementById('statAvg').textContent = avg;
    }
  </script>
</body>
</html>
