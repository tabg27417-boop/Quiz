<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Result</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <nav>
    <span class="brand"><img src="logo.jpg" alt="QuizVai" style="height:34px;border-radius:6px;object-fit:contain;"></span>
    <div id="navRight"></div>
  </nav>

  <div id="loading" class="box center">
    <div class="loader"></div>
    <p style="margin-top:12px;color:var(--text3);">Loading result...</p>
  </div>
  <div id="resultArea" style="display:none"></div>
  <div id="msg"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script>
    var attemptId = new URLSearchParams(location.search).get('id');
    var isPracticeResult = new URLSearchParams(location.search).get('practice') === 'true';

    // ── PRACTICE MODE: render from sessionStorage, no Firestore ──
    if (isPracticeResult) {
      firebase.auth().onAuthStateChanged(function(u) {
        if (!u) { location = 'index.html'; return; }
        db.collection('users').doc(u.uid).get().then(function(uDoc) {
          var userData = uDoc.exists ? uDoc.data() : { name: 'Student', batch: '' };
          buildNav(userData, false);
          var raw = sessionStorage.getItem('practiceResult');
          if (!raw) {
            document.getElementById('loading').innerHTML = '<p style="color:var(--danger);font-weight:600;"><i class="fa-solid fa-triangle-exclamation"></i> No practice result found. Please retake the quiz.</p>';
            return;
          }
          var pr = JSON.parse(raw);
          document.getElementById('loading').style.display = 'none';
          renderResult(pr.quizData, pr, userData.name, userData.batch || '', false, false, true);
        });
      });
    } else if (!attemptId) {
      document.getElementById('loading').innerHTML = '<p style="color:var(--danger);font-weight:600;"><i class="fa-solid fa-triangle-exclamation"></i> No result ID found</p>';
    } else {
      firebase.auth().onAuthStateChanged(function(u) {
        if (!u) { location = 'index.html'; return; }
        loadResult(u);
      });
    }

    function buildNav(userData, isAdmin) {
      var nav = document.getElementById('navRight');
      var batch = userData.batch || '';
      var isHSC = batch === 'HSC';
      var batchHtml = batch
        ? '<span style="background:rgba(255,255,255,0.2);color:white;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;border:1px solid rgba(255,255,255,0.3);display:inline-flex;align-items:center;gap:5px;"><i class="fa-solid ' + (isAdmin ? 'fa-shield-halved' : isHSC ? 'fa-graduation-cap' : 'fa-school') + '"></i>' + (isAdmin ? 'Admin' : batch) + '</span>' : '';
      nav.innerHTML =
        '<span style="color:rgba(255,255,255,0.9);font-size:13px;display:inline-flex;align-items:center;gap:6px;"><i class="fa-solid fa-circle-user" style="font-size:15px;"></i> ' + userData.name + '</span>' +
        batchHtml +
        '<a href="' + (isAdmin ? 'admin.html' : 'index.html') + '" style="color:#fff;text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);font-weight:600;"><i class="fa-solid fa-house"></i> Dashboard</a>' +
        '<button onclick="logout()" style="background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.3);padding:7px 16px;border-radius:20px;cursor:pointer;font-size:12.5px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:6px;" onmouseover="this.style.background=\'rgba(220,38,38,0.5)\'" onmouseout="this.style.background=\'rgba(255,255,255,0.15)\'"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>';
    }

    function loadResult(u) {
      var userData = null, isAdmin = false;
      db.collection('users').doc(u.uid).get()
        .then(function(uDoc) {
          userData = uDoc.data(); isAdmin = userData.isAdmin;
          buildNav(userData, isAdmin);
          return db.collection('attempts').doc(attemptId).get();
        })
        .then(function(aDoc) {
          if (!aDoc.exists) { document.getElementById('loading').style.display = 'none'; flash('Result not found', false); throw new Error('NOT_FOUND'); }
          var attempt = aDoc.data();
          if (attempt.userId !== u.uid && !isAdmin) { document.getElementById('loading').style.display = 'none'; flash('Access denied', false); throw new Error('ACCESS_DENIED'); }
          return db.collection('quizzes').doc(attempt.quizId).get().then(function(qDoc) { return { attempt: attempt, quizDoc: qDoc }; });
        })
        .then(function(result) {
          var attempt = result.attempt, qDoc = result.quizDoc;
          if (!qDoc.exists) { document.getElementById('loading').style.display = 'none'; flash('Quiz has been deleted', false); return; }
          var quiz = qDoc.data();
          var studentPromise = Promise.resolve(null);
          if (isAdmin && attempt.userId !== u.uid) studentPromise = db.collection('users').doc(attempt.userId).get();
          return studentPromise.then(function(sDoc) {
            var studentName = userData.name, studentBatch = userData.batch || '';
            if (sDoc && sDoc.exists) { studentName = sDoc.data().name; studentBatch = sDoc.data().batch || ''; }
            renderResult(quiz, attempt, studentName, studentBatch, isAdmin, attempt.userId !== u.uid, false);
          });
        })
        .catch(function(e) {
          if (e.message === 'NOT_FOUND' || e.message === 'ACCESS_DENIED') return;
          document.getElementById('loading').style.display = 'none';
          flash('Error loading result', false);
        });
    }

    function renderResult(quiz, attempt, studentName, studentBatch, isAdmin, isOtherStudent, isPractice) {
      var score = attempt.score, total = attempt.total;
      var pct = Math.round((score / total) * 100);
      var grade = pct >= 70 ? 'good' : pct >= 40 ? 'mid' : 'bad';
      var correctCount = 0, wrongCount = 0, skippedCount = 0;
      for (var i = 0; i < quiz.questions.length; i++) {
        var q = quiz.questions[i], ans = attempt.answers[q.id];
        if (!ans) skippedCount++;
        else if (ans === q.correct) correctCount++;
        else wrongCount++;
      }
      var timeStr = '';
      if (attempt.timeTaken) timeStr = Math.floor(attempt.timeTaken / 60) + 'm ' + (attempt.timeTaken % 60) + 's';

      var html = '<div class="box">';

      // Practice mode banner
      if (isPractice) {
        html += '<div style="background:linear-gradient(135deg,rgba(124,58,237,0.12),rgba(79,70,229,0.08));border:1.5px solid rgba(124,58,237,0.35);border-radius:10px;padding:12px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px;">';
        html += '<i class="fa-solid fa-rotate-right" style="color:#7c3aed;font-size:20px;flex-shrink:0;"></i>';
        html += '<div><strong style="color:#7c3aed;font-size:14px;display:block;">Practice Mode Result</strong>';
        html += '<span style="color:var(--text2);font-size:12.5px;">This is a practice attempt. Your original score and leaderboard position are unchanged.</span></div>';
        html += '</div>';
      }

      if (isAdmin && isOtherStudent) {
        html += '<div style="background:var(--surface2);padding:12px 16px;border-radius:8px;margin-bottom:16px;border:1px solid var(--border);display:flex;align-items:center;gap:8px;">';
        html += '<i class="fa-solid fa-user-circle" style="color:var(--primary);font-size:18px;"></i><strong>Student:</strong> ' + studentName;
        if (studentBatch) html += ' <span class="badge ' + (studentBatch === 'HSC' ? 'purple' : 'blue') + '"><i class="fa-solid ' + (studentBatch === 'HSC' ? 'fa-graduation-cap' : 'fa-school') + '"></i> ' + studentBatch + '</span>';
        html += '</div>';
      }

      html += '<h2 style="margin-bottom:6px;">' + quiz.title + '</h2>';
      html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">';
      if (quiz.batch) html += '<span class="badge ' + (quiz.batch === 'HSC' ? 'purple' : 'blue') + '"><i class="fa-solid ' + (quiz.batch === 'HSC' ? 'fa-graduation-cap' : 'fa-school') + '"></i> ' + quiz.batch + '</span>';
      if (quiz.subject) html += '<span class="badge gray"><i class="fa-solid fa-book-open"></i> ' + quiz.subject + '</span>';
      html += '<span class="badge gray"><i class="fa-solid fa-circle-question"></i> ' + total + ' Questions</span>';
      if (timeStr) html += '<span class="badge gray"><i class="fa-regular fa-clock"></i> ' + timeStr + '</span>';
      if (attempt.date) html += '<span class="badge gray"><i class="fa-regular fa-calendar"></i> ' + new Date(attempt.date).toLocaleDateString() + '</span>';
      html += '</div>';

      html += '<div class="score-circle ' + grade + '">' + pct + '%<small>' + score + ' / ' + total + '</small></div>';

      html += '<div class="summary-grid">';
      html += '<div class="summary-item green-bg"><div class="num">' + correctCount + '</div><div class="lbl"><i class="fa-solid fa-check"></i> Correct</div></div>';
      html += '<div class="summary-item red-bg"><div class="num">' + wrongCount + '</div><div class="lbl"><i class="fa-solid fa-xmark"></i> Wrong</div></div>';
      html += '<div class="summary-item orange-bg"><div class="num">' + skippedCount + '</div><div class="lbl"><i class="fa-solid fa-forward"></i> Skipped</div></div>';
      html += '</div>';

      var motivMsg = pct >= 90
        ? '<i class="fa-solid fa-trophy"></i> Excellent!'
        : pct >= 70 ? '<i class="fa-solid fa-hands-clapping"></i> Great job!'
        : pct >= 40 ? '<i class="fa-solid fa-book-open"></i> Keep practicing!'
        : '<i class="fa-solid fa-dumbbell"></i> Don\'t give up!';
      var motivColor = pct >= 70 ? 'var(--success)' : pct >= 40 ? 'var(--warning)' : 'var(--danger)';
      html += '<p class="center" style="color:' + motivColor + ';font-size:18px;font-weight:700;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;">' + motivMsg + '</p>';
      html += '</div>';

      // Filter buttons
      html += '<div class="box" style="padding:14px 20px;">';
      html += '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">';
      html += '<span style="font-size:13px;color:var(--text2);font-weight:600;"><i class="fa-solid fa-filter"></i> Filter:</span>';
      html += '<button class="btn sm blue" onclick="filterQ(\'all\')"><i class="fa-solid fa-list"></i> All (' + total + ')</button>';
      html += '<button class="btn sm green" onclick="filterQ(\'correct\')"><i class="fa-solid fa-check"></i> Correct (' + correctCount + ')</button>';
      html += '<button class="btn sm red" onclick="filterQ(\'wrong\')"><i class="fa-solid fa-xmark"></i> Wrong (' + wrongCount + ')</button>';
      if (skippedCount > 0) html += '<button class="btn sm orange" onclick="filterQ(\'skipped\')"><i class="fa-solid fa-forward"></i> Skipped (' + skippedCount + ')</button>';
      html += '</div></div>';

      // Questions review
      html += '<div id="questionsReview">';
      for (var i = 0; i < quiz.questions.length; i++) {
        var q = quiz.questions[i];
        var ans = attempt.answers[q.id] || '';
        var isCorrect = ans === q.correct, isSkipped = !ans;
        var blockClass = isSkipped ? 'skipped' : isCorrect ? 'correct' : 'wrong';
        var statusBadge = isSkipped
          ? '<span class="badge orange"><i class="fa-solid fa-forward"></i> Skipped</span>'
          : isCorrect ? '<span class="badge green"><i class="fa-solid fa-check"></i> Correct</span>'
          : '<span class="badge red"><i class="fa-solid fa-xmark"></i> Wrong</span>';
        html += '<div class="q-block ' + blockClass + '" data-status="' + blockClass + '">';
        html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:12px;">';
        html += '<div style="display:flex;gap:8px;align-items:flex-start;flex:1;">';
        html += '<span style="background:var(--primary);color:#fff;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;flex-shrink:0;">Q' + (i+1) + '</span>';
        html += '<strong>' + q.text + '</strong></div>' + statusBadge + '</div>';
        if (q.imageUrl && q.imageUrl.trim()) {
          html += '<div style="margin-bottom:12px;"><img src="' + q.imageUrl.trim() + '" alt="Question image" style="max-width:100%;max-height:320px;border-radius:8px;border:1.5px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,0.08);display:block;" onerror="this.style.display=\'none\'"></div>';
        }
        var opts = ['a', 'b', 'c', 'd'];
        for (var j = 0; j < opts.length; j++) {
          var o = opts[j];
          var optClass = 'opt', icon = '', extra = '';
          if (o === q.correct) { optClass += ' correct-opt'; icon = ' <i class="fa-solid fa-check-circle" style="color:var(--success);"></i>'; }
          if (o === ans && o !== q.correct) { optClass += ' wrong-opt'; icon = ' <i class="fa-solid fa-times-circle" style="color:var(--danger);"></i>'; }
          if (o === ans) extra = ' <span style="font-size:11px;color:var(--text3);">(Your answer)</span>';
          html += '<div class="' + optClass + '"><span style="background:var(--border);color:var(--text2);padding:1px 7px;border-radius:4px;font-size:12px;font-weight:700;margin-right:6px;">' + o.toUpperCase() + '</span>' + q[o] + icon + extra + '</div>';
        }
        if (q.explanation) html += '<div class="explain"><i class="fa-solid fa-lightbulb" style="color:var(--warning);"></i> <strong>Explanation:</strong> ' + q.explanation + '</div>';
        html += '</div>';
      }
      html += '</div>';

      html += '<div class="center" style="margin:24px 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">';
      if (isPractice) {
        html += '<a class="btn" style="background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:none;" href="quiz.html?id=' + attempt.quizId + '&practice=true"><i class="fa-solid fa-rotate-right"></i> Practice Again</a>';
      }
      html += '<a class="btn blue" href="' + (isAdmin ? 'admin.html' : 'index.html') + '"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>';
      html += '</div>';

      document.getElementById('loading').style.display = 'none';
      document.getElementById('resultArea').innerHTML = html;
      document.getElementById('resultArea').style.display = 'block';
    }

    function filterQ(type) {
      var blocks = document.querySelectorAll('#questionsReview .q-block');
      for (var i = 0; i < blocks.length; i++) {
        var status = blocks[i].getAttribute('data-status');
        blocks[i].style.display = (type === 'all' || status === type) ? 'block' : 'none';
      }
    }
  </script>
</body>
</html>
