<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Take Quiz – QuizVai</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <nav>
    <span class="brand">
      <img src="logo.jpg" style="height:34px;border-radius:6px;">
    </span>
    <div id="navRight"></div>
  </nav>

  <!-- LOADING -->
  <div id="loading" class="box center">
    <div class="loader"></div>
    <p style="margin-top:12px;color:var(--text3);">Loading quiz...</p>
  </div>

  <!-- QUIZ AREA -->
  <div id="quizArea" style="display:none">

    <div class="box">
      <h2 id="qzTitle"></h2>

      <!-- SUBJECT + TOPIC -->
      <div id="qzMeta" style="margin-top:6px;color:var(--text3);font-size:13px;"></div>

      <div id="qzTimer" style="font-size:20px;font-weight:700;color:var(--primary);margin-top:10px;">
        ⏱ <span id="qzTimerText">00:00</span>
      </div>

      <div class="progress-bar-wrap" style="margin-top:10px;">
        <div class="progress-bar-fill" id="qzProgress"></div>
      </div>

      <div id="qzAnswered" style="margin-top:8px;color:var(--text3);font-size:13px;"></div>
    </div>

    <div id="qzQuestions"></div>

    <div id="qzSubmit" class="center" style="margin:20px 0;"></div>

  </div>

  <!-- TIME UP -->
  <div id="timeUpOverlay"
       style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;align-items:center;justify-content:center;">
    <div style="background:#fff;padding:30px;border-radius:14px;text-align:center;">
      <h2>⏰ Time's Up!</h2>
      <p>Auto submitting...</p>
      <div class="loader"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>

  <script>
    var quizId = new URLSearchParams(location.search).get('id');
    var quiz = null;
    var answers = {};
    var timer = null;

    var countdown = 0;
    var isCountdown = false;

    firebase.auth().onAuthStateChanged(function(u){
      if(!u) location.href="index.html";
      else checkAccess(u);
    });

    // 🔥 STEP 1: CHECK ALREADY SUBMITTED (LOCK SYSTEM)
    function checkAccess(u){

      db.collection("userQuizStatus")
        .doc(u.uid + "_" + quizId)
        .get()
        .then(function(lockDoc){

          if(lockDoc.exists && lockDoc.data().done){
            location.href = "result.html?id=" + lockDoc.data().attemptId;
            return;
          }

          loadQuiz(u);
        });
    }

    // LOAD QUIZ
    function loadQuiz(u){
      db.collection("quizzes").doc(quizId).get().then(function(doc){
        quiz = doc.data();

        document.getElementById("qzTitle").innerText = quiz.title;

        // SUBJECT + TOPIC
        document.getElementById("qzMeta").innerHTML =
          (quiz.subject ? "📘 Subject: " + quiz.subject : "") +
          (quiz.topic ? " • 📚 Topic: " + quiz.topic : "");

        if(quiz.timeLimit){
          isCountdown = true;
          countdown = quiz.timeLimit * 60;
        }

        document.getElementById("loading").style.display="none";
        document.getElementById("quizArea").style.display="block";

        startTimer();
        render();
      });
    }

    // TIMER
    function startTimer(){
      timer = setInterval(function(){
        if(isCountdown){
          countdown--;
          if(countdown<=0){
            clearInterval(timer);
            timeUp();
          }
          updateTime(countdown);
        }
      },1000);
    }

    function updateTime(s){
      var m = Math.floor(s/60);
      var sec = s%60;
      document.getElementById("qzTimerText").innerText =
        (m<10?"0":"")+m+":"+(sec<10?"0":"")+sec;
    }

    function timeUp(){
      document.getElementById("timeUpOverlay").style.display="flex";
      setTimeout(submitQuiz,1500);
    }

    // RENDER QUESTIONS
    function render(){
      var html="";

      for(var i=0;i<quiz.questions.length;i++){
        var q = quiz.questions[i];
        var locked = answers[q.id] !== undefined;

        html += '<div class="q-block">';
        html += '<h4>Q'+(i+1)+'. '+q.text+'</h4>';

        ['a','b','c','d'].forEach(function(o){

          var disabled = locked ? "pointer-events:none;opacity:0.6;" : "";
          var checked = answers[q.id]===o ? "checked" : "";

          html += `
          <div class="radio-opt" style="${disabled}" onclick="pick('${q.id}','${o}',this)">
            <input type="radio" name="${q.id}" ${checked} ${locked ? "disabled" : ""}>
            <span>${o.toUpperCase()}. ${q[o]}</span>
          </div>`;
        });

        html += '</div>';
      }

      document.getElementById("qzQuestions").innerHTML = html;
      updateSubmit();
    }

    // PICK (LOCK AFTER FIRST CLICK)
    function pick(qid,val){
      if(answers[qid]) return;

      answers[qid] = val;
      updateSubmit();
      render();
    }

    // UPDATE UI
    function updateSubmit(){

      document.getElementById("qzAnswered").innerText =
        Object.keys(answers).length + " answered";

      document.getElementById("qzProgress").style.width =
        (Object.keys(answers).length/quiz.questions.length)*100+"%";

      document.getElementById("qzSubmit").innerHTML =
        '<button class="btn green" onclick="submitQuiz()">'+
        '<i class="fa-solid fa-paper-plane"></i> Submit Quiz</button>';
    }

    // SUBMIT + LOCK SAVE
    function submitQuiz(){
      clearInterval(timer);

      var uid = firebase.auth().currentUser.uid;
      var score = 0;

      for(var i=0;i<quiz.questions.length;i++){
        if(answers[quiz.questions[i].id] === quiz.questions[i].correct){
          score++;
        }
      }

      db.collection("attempts").add({
        userId: uid,
        quizId: quizId,
        answers: answers,
        score: score,
        total: quiz.questions.length,
        date: new Date().toISOString()
      }).then(function(ref){

        // 🔥 SAVE LOCK (IMPORTANT)
        db.collection("userQuizStatus")
          .doc(uid + "_" + quizId)
          .set({
            done: true,
            attemptId: ref.id,
            time: new Date()
          });

        location.href = "result.html?id=" + ref.id;
      });
    }

  </script>
</body>
</html>
